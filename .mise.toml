# .mise.toml
[tools]
# `lg` itself is not listed: lgx.edn sets `:lg-runtime :built`, so lgx builds
# the pinned let-go (with Wails and the sqlite driver linked in) using the Go
# toolchain.
go = "1.27"
node = "24"
lgx = "0.5.3"
cljfmt = "0.16.6"
clj-kondo = "2026.08.04"

[tool_alias]
lgx = "github:abogoyavlensky/lgx"
cljfmt = "github:weavejester/cljfmt"
